<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Agreed 근거 기반 업무 에이전트 아키텍처</title>
  <desc id="desc">C4 스타일 컨테이너 관점으로 외부 업무 자료, FastAPI 애플리케이션, 제한된 에이전트 런타임, 근거 검증, 사람 승인, MongoDB 저장소와 횡단 통제를 보여준다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family: Pretendard, "Noto Sans KR", Inter, Arial, sans-serif; fill: #0f172a; }
      .title { font-size: 32px; font-weight: 800; letter-spacing: -0.5px; }
      .subtitle { font-size: 15px; fill: #475569; }
      .zone { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .trust { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 8 7; }
      .zoneLabel { font-size: 13px; font-weight: 700; fill: #64748b; letter-spacing: 0.6px; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.4; }
      .blue { fill: #eff6ff; stroke: #3b82f6; }
      .green { fill: #f0fdf4; stroke: #22c55e; }
      .amber { fill: #fffbeb; stroke: #f59e0b; }
      .red { fill: #fff7ed; stroke: #f97316; }
      .slate { fill: #f8fafc; stroke: #64748b; }
      .boxTitle { font-size: 16px; font-weight: 800; }
      .boxMeta { font-size: 12px; font-weight: 700; fill: #2563eb; }
      .body { font-size: 13px; fill: #334155; }
      .small { font-size: 11.5px; fill: #475569; }
      .arrow { fill: none; stroke: #475569; stroke-width: 1.8; marker-end: url(#arrow); }
      .blueArrow { fill: none; stroke: #2563eb; stroke-width: 2; marker-end: url(#arrowBlue); }
      .feedback { fill: none; stroke: #2563eb; stroke-width: 1.8; stroke-dasharray: 6 5; marker-end: url(#arrowBlue); }
      .divider { stroke: #e2e8f0; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#ffffff"/>
  <rect x="0" y="0" width="1600" height="8" fill="#2563eb"/>
  <text x="58" y="58" class="title">Agreed 근거 기반 업무 에이전트</text>
  <text x="58" y="86" class="subtitle">C4-style container view · 결정적 워크플로와 제한된 도구 루프 · 쓰기 작업은 사람 승인 뒤에만 실행</text>

  <rect x="1172" y="34" width="18" height="18" class="red"/><text x="1198" y="48" class="small">외부 비신뢰 입력</text>
  <rect x="1312" y="34" width="18" height="18" class="blue"/><text x="1338" y="48" class="small">자동 실행</text>
  <rect x="1422" y="34" width="18" height="18" class="amber"/><text x="1448" y="48" class="small">사람 결정</text>

  <rect x="48" y="125" width="250" height="542" rx="10" class="zone"/>
  <text x="68" y="151" class="zoneLabel">EXTERNAL SYSTEMS · UNTRUSTED</text>

  <rect x="72" y="183" width="202" height="78" rx="7" class="red"/>
  <text x="90" y="208" class="boxTitle">Gmail / Slack</text>
  <text x="90" y="230" class="body">업무 요청과 대화</text>
  <text x="90" y="249" class="small">OAuth 연동 · 읽기 데이터</text>

  <rect x="72" y="291" width="202" height="78" rx="7" class="red"/>
  <text x="90" y="316" class="boxTitle">계약 / 문서</text>
  <text x="90" y="338" class="body">범위, 일정, 금액, 산출물</text>
  <text x="90" y="357" class="small">모델 명령이 아닌 분석 대상</text>

  <rect x="72" y="399" width="202" height="78" rx="7" class="red"/>
  <text x="90" y="424" class="boxTitle">GitHub 근거</text>
  <text x="90" y="446" class="body">이슈, 코드, 변경 이력</text>
  <text x="90" y="465" class="small">사용자와 프로젝트 범위 고정</text>

  <rect x="72" y="513" width="202" height="116" rx="7" class="slate"/>
  <text x="90" y="539" class="boxTitle">신뢰 경계 원칙</text>
  <text x="90" y="563" class="body">• 외부 지시문 실행 금지</text>
  <text x="90" y="585" class="body">• 허용 도구로만 접근</text>
  <text x="90" y="607" class="body">• 원문은 로그에 미저장</text>

  <rect x="330" y="125" width="1218" height="542" rx="10" class="trust"/>
  <text x="350" y="151" class="zoneLabel">AGREED APPLICATION TRUST BOUNDARY</text>

  <rect x="360" y="182" width="210" height="147" rx="8" class="box"/>
  <text x="380" y="208" class="boxTitle">API / Session</text>
  <text x="380" y="231" class="boxMeta">FastAPI · HttpOnly Cookie</text>
  <line x1="380" y1="244" x2="550" y2="244" class="divider"/>
  <text x="380" y="267" class="body">요청 인증과 사용자 식별</text>
  <text x="380" y="290" class="body">OAuth 토큰 서버 보관</text>
  <text x="380" y="313" class="small">app/api · app/services</text>

  <rect x="610" y="182" width="235" height="147" rx="8" class="blue"/>
  <text x="630" y="208" class="boxTitle">Workflow Orchestrator</text>
  <text x="630" y="231" class="boxMeta">Python · deterministic flow</text>
  <line x1="630" y1="244" x2="825" y2="244" class="divider"/>
  <text x="630" y="267" class="body">추출 → 대조 → 영향 분석</text>
  <text x="630" y="290" class="body">정해진 순서는 코드가 통제</text>
  <text x="630" y="313" class="small">infra/llm/orchestrator.py</text>

  <rect x="885" y="168" width="300" height="176" rx="8" class="blue"/>
  <text x="905" y="195" class="boxTitle">Bounded Agent Runtime</text>
  <text x="905" y="218" class="boxMeta">DeepSeek · OpenAI-compatible SDK</text>
  <line x1="905" y1="231" x2="1165" y2="231" class="divider"/>
  <text x="905" y="254" class="body">필요한 읽기 도구만 선택</text>
  <text x="905" y="277" class="body">JSON Schema 인자 검증</text>
  <text x="905" y="300" class="body">중복 호출 차단 · 안전 종료</text>
  <text x="905" y="326" class="small">infra/llm/harness.py · client.py</text>

  <rect x="1225" y="182" width="286" height="147" rx="8" class="green"/>
  <text x="1245" y="208" class="boxTitle">Scoped Tool Registry</text>
  <text x="1245" y="231" class="boxMeta">least privilege · owner scope</text>
  <line x1="1245" y1="244" x2="1491" y2="244" class="divider"/>
  <text x="1245" y="267" class="body">READ_ONLY 기본 허용</text>
  <text x="1245" y="290" class="body">WRITE는 승인 콜백 필수</text>
  <text x="1245" y="313" class="small">AgentTool · ToolRisk</text>

  <rect x="610" y="408" width="260" height="164" rx="8" class="green"/>
  <text x="630" y="435" class="boxTitle">Grounding &amp; Validation Gate</text>
  <text x="630" y="458" class="boxMeta">Pydantic · source re-check</text>
  <line x1="630" y1="471" x2="850" y2="471" class="divider"/>
  <text x="630" y="494" class="body">구조화 출력 스키마 검증</text>
  <text x="630" y="517" class="body">인용문을 실제 원문과 대조</text>
  <text x="630" y="540" class="body">실패 시 안전 상태로 강등</text>
  <text x="630" y="561" class="small">core/grounding.py</text>

  <rect x="930" y="408" width="260" height="164" rx="8" class="amber"/>
  <text x="950" y="435" class="boxTitle">Human Approval Gate</text>
  <text x="950" y="458" class="boxMeta">scope · schedule · amount</text>
  <line x1="950" y1="471" x2="1170" y2="471" class="divider"/>
  <text x="950" y="494" class="body">계약 변경 전 검토</text>
  <text x="950" y="517" class="body">승인된 호출만 쓰기 실행</text>
  <text x="950" y="540" class="body">거부 시 기존 상태 유지</text>
  <text x="950" y="561" class="small">core/contract_ops.py</text>

  <rect x="1250" y="408" width="235" height="164" rx="8" class="slate"/>
  <text x="1270" y="435" class="boxTitle">Application Data</text>
  <text x="1270" y="458" class="boxMeta">MongoDB · Beanie ODM</text>
  <line x1="1270" y1="471" x2="1465" y2="471" class="divider"/>
  <text x="1270" y="494" class="body">사용자별 데이터 귀속</text>
  <text x="1270" y="517" class="body">업무, 계약, 검토 상태</text>
  <text x="1270" y="540" class="body">승인 뒤 상태 변경</text>
  <text x="1270" y="561" class="small">MongoDB collections</text>

  <path d="M274 222 H350" class="arrow"/><text x="287" y="211" class="small">HTTPS / OAuth</text>
  <path d="M570 255 H600" class="arrow"/>
  <path d="M845 255 H875" class="blueArrow"/>
  <path d="M1185 255 H1215" class="blueArrow"/>
  <path d="M1035 344 V382 H740 V398" class="blueArrow"/>
  <path d="M870 490 H920" class="arrow"/>
  <path d="M1190 490 H1240" class="arrow"/>
  <path d="M1368 329 V398" class="feedback"/>
  <path d="M740 408 V376 H1035 V354" class="feedback"/>
  <text x="800" y="370" class="small">근거 부족 → 제한된 추가 탐색</text>

  <rect x="48" y="708" width="1500" height="190" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="68" y="737" class="zoneLabel">CROSS-CUTTING CONTROL PLANE · CODE-ENFORCED</text>

  <rect x="72" y="762" width="270" height="104" rx="7" class="box"/>
  <text x="90" y="788" class="boxTitle">Execution Budget</text>
  <text x="90" y="813" class="body">max turns · wall time</text>
  <text x="90" y="836" class="body">total / per-tool / parallel limits</text>
  <text x="90" y="855" class="small">AgentPolicy</text>

  <rect x="370" y="762" width="270" height="104" rx="7" class="box"/>
  <text x="388" y="788" class="boxTitle">Tool Safety</text>
  <text x="388" y="813" class="body">schema allowlist · duplicate hash</text>
  <text x="388" y="836" class="body">fail-closed write approval</text>
  <text x="388" y="855" class="small">SHA-256 fingerprint</text>

  <rect x="668" y="762" width="270" height="104" rx="7" class="box"/>
  <text x="686" y="788" class="boxTitle">Safe Observability</text>
  <text x="686" y="813" class="body">stop reason · counts · latency</text>
  <text x="686" y="836" class="body">no raw prompt, result, or secret</text>
  <text x="686" y="855" class="small">AgentRunTrace</text>

  <rect x="966" y="762" width="270" height="104" rx="7" class="box"/>
  <text x="984" y="788" class="boxTitle">Regression Verification</text>
  <text x="984" y="813" class="body">permission · validation · loop</text>
  <text x="984" y="836" class="body">18 tests passed · 5 harness tests</text>
  <text x="984" y="855" class="small">Python unittest</text>

  <rect x="1264" y="762" width="252" height="104" rx="7" class="amber"/>
  <text x="1282" y="788" class="boxTitle">Responsibility Boundary</text>
  <text x="1282" y="813" class="body">AI: retrieve and draft</text>
  <text x="1282" y="836" class="body">Human: approve business change</text>
  <text x="1282" y="855" class="small">HITL · fail safe</text>

  <text x="58" y="944" class="subtitle">Implemented 2026-11-16 · Architecture evidence: docs/AI_HARNESS_EVIDENCE.md · Runtime quality requires a separate evaluation dataset</text>
</svg>
